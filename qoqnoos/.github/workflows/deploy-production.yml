name: Deploy Production
on:
  push:
    branches: [main]
jobs:
  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: aquasecurity/trivy-action@master
        with: { scan-type: fs, scan-ref: '.', severity: 'CRITICAL,HIGH', exit-code: '1' }
  deploy:
    runs-on: ubuntu-latest
    needs: [security-scan]
    environment:
      name: production
      url: https://qoqnoos.com
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER_PROD }}
          service_account: ${{ secrets.GCP_SA_PROD }}
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: qoqnoos-cluster, location: us-central1 }
      - run: kubectl exec -n production deployment/api -- npx prisma migrate deploy
      - run: |
          kubectl set image deployment/api api=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID_PROD }}/qoqnoos/api:${{ github.sha }} -n production
          kubectl rollout status deployment/api -n production --timeout=600s
