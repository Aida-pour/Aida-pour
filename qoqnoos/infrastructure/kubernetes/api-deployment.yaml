apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: production
  labels:
    app: qoqnoos-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: qoqnoos-api
  template:
    metadata:
      labels:
        app: qoqnoos-api
    spec:
      containers:
        - name: api
          image: us-central1-docker.pkg.dev/PROJECT_ID/qoqnoos/api:latest
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: api-service
  namespace: production
spec:
  selector:
    app: qoqnoos-api
  ports:
    - port: 80
      targetPort: 3000
  type: ClusterIP
