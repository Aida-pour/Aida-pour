name: Deploy Staging
on:
  push:
    branches: [develop]
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SA_STAGING }}
      - uses: google-github-actions/get-gke-credentials@v2
        with: { cluster_name: qoqnoos-cluster, location: us-central1 }
      - run: |
          kubectl set image deployment/api api=us-central1-docker.pkg.dev/${{ secrets.GCP_PROJECT_ID }}/qoqnoos/api:${{ github.sha }} -n staging
          kubectl rollout status deployment/api -n staging --timeout=300s
